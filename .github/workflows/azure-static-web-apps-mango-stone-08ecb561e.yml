name: Deploy to Azure (Dev)

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
    types: [opened, synchronize, reopened]

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    env:
      ci: false
    steps:
      # Step 1: Check out the repository
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          submodules: true # Ensures submodules are also cloned
          lfs: false # Skip Git Large File Storage

      # Step 2: Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16' # Use a compatible Node.js version
          cache: 'npm'

      # Step 3: Install dependencies
      - name: Install dependencies
        run: npm ci

      # Step 4: Build the application
      - name: Build the app
        run: npm run build:dev

      # Step 5: Deploy to Azure Static Web Apps
      - name: Deploy to Azure Static Web Apps
        id: deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_MANGO_STONE_08ECB561E }}
          action: "upload"
          app_location: "/" # Path to your app's source code
          app_build_command: "npm run build:dev" # Command to build your app
          output_location: "build" # Directory containing the built app

      # Optional: Add notifications for deployment success or failure
      - name: Notify on success
        if: success()
        run: echo "Deployment succeeded!"
      - name: Notify on failure
        if: failure()
        run: echo "Deployment failed. Please check the logs."
