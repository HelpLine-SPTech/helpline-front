name: CI/CD Pipeline

on:
  push:
    branches:
      - develop  # Executa o pipeline ao fazer push para a branch principal.

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # Checkout do repositório
    - name: Checkout repository
      uses: actions/checkout@v3

    # Setup do Node.js para build do React
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18

    # Instalar dependências e build da aplicação
    - name: Install dependencies and build React app
      run: |
        npm install
        npm run build
      env: 
          CI: false

    # Setup do Docker para build e push da imagem
    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_TOKEN }}

    - name: Build and push Docker image
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/react-nginx-app:latest .
        docker push ${{ secrets.DOCKER_USERNAME }}/react-nginx-app:latest

    # Deploy no servidor via SSH
    - name: Deploy to Server
      uses: appleboy/ssh-action@v0.1.7
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          docker pull ${{ secrets.DOCKER_USERNAME }}/react-nginx-app:latest
          docker stop react-app || true
          docker rm react-app || true
          docker run -d --name react-app -p 80:80 ${{ secrets.DOCKER_USERNAME }}/react-nginx-app:latest
